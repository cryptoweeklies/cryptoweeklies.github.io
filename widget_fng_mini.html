<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FearGreed Mini</title>
    <style>
        body {
            margin: 0; padding: 14px 20px;
            background-color: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; height: 100vh; overflow: hidden;
        }
        .lbl-top { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 4px 0; }
        .val-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
        .score { font-size: 28px; font-weight: 900; font-family: monospace; margin: 0; line-height: 1; }
        .status-pill { font-size: 11px; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; border: 1px solid currentColor; font-family: monospace; }

        /* Sparkline Barometer */
        .bar-wrapper { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .bar-marker { position: absolute; top: 0; width: 3px; height: 100%; background: #fff; box-shadow: 0 0 6px #fff; }
    </style>
<!-- cw:seo-noindex --><meta name="robots" content="noindex,follow" /><!-- /cw:seo-noindex -->
</head>
<body>
    <div class="val-row">
        <span class="score" style="color: #4ade80;">74/100</span>
        <span class="status-pill" style="color: #4ade80;">Greed</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 10px; color: #64748b; font-family: monospace; margin-bottom: 4px;">
        <span>0 (Extreme Fear)</span><span>100 (Extreme Greed)</span>
    </div>
    <div class="bar-wrapper">
        <div class="bar-fill" style="width: 74%; background: linear-gradient(90deg, #ef4444, #f97316, #facc15, #4ade80, #22c55e);"></div>
        <div class="bar-marker" style="left: 74%;"></div>
    </div>
</body>
</html>
