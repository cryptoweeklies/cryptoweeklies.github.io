<!DOCTYPE html>

<head>

<title>Get the CryptoWeeklies iOS app</title>

<!-- cryptoweeklies.com/ios: the short link for the iOS app. An iPhone or iPad
     goes straight to the App Store listing, from the script below, with
     replace() so this page never lands in history and Back does not bounce
     the reader straight back into it.

     Until 2026-10-14 this was a meta refresh for everyone, which sent a
     desktop to the apps.apple.com web page -- a page that cannot install
     anything and leaves the reader to find the app again on the phone. A meta
     refresh cannot branch on the device, so it is gone, as it went from /app:
     every other browser stays and sees what /app shows a desktop, both stores
     and a QR code that opens /app on the phone. In-app browsers (YouTube,
     X, Telegram) run the script; an iPhone with scripting off sees the App
     Store button first, one tap away.

     The canonical is /app/: for anything that is not an iPhone this page is
     that one, and two addresses for one page split it in search. -->
<link rel="canonical" href="https://cryptoweeklies.com/app/" />

<!-- A share of this URL is the whole point of it, and a crawler that does not
     run the script would otherwise render a blank card. -->
<meta property="og:title" content="CryptoWeeklies: Risk &amp; Alerts — iOS app" />
<meta property="og:description" content="Risk scores, market phase and reader-set alerts for crypto, AI and quantum stock universes. Free, no ads, no signals." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://cryptoweeklies.com/ios" />
<meta property="og:image" content="https://cryptoweeklies.com/cw_logo_192_192.png" />
<meta property="og:image:alt" content="CryptoWeeklies logo" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="CryptoWeeklies: Risk &amp; Alerts — iOS app" />
<meta name="twitter:description" content="Risk scores, market phase and reader-set alerts for crypto, AI and quantum stock universes. Free, no ads, no signals." />
<meta name="twitter:image" content="https://cryptoweeklies.com/cw_logo_192_192.png" />
<meta name="twitter:image:alt" content="CryptoWeeklies logo" />

<script>
  (function () {
    var ua = navigator.userAgent || '';
    // iPadOS 13+ reports itself as a Mac; a Mac with a touch screen is an iPad.
    var ios = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios) {
      location.replace("https://apps.apple.com/us/app/cryptoweeklies-risk-alerts/id6815463434");
    }
  })();
</script>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b1120; color: #e2e8f0; padding: 24px 16px;
  }
  main {
    width: 100%; max-width: 720px;
    background: #0b0e14; border: 1px solid #1e293b; border-radius: 16px;
    padding: 28px;
  }
  h1 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 6px; color: #f1f5f9; }
  .lede { margin: 0 0 24px; color: #94a3b8; }
  .door { display: flex; flex-wrap: wrap; align-items: center; gap: 24px 32px; }
  .stores { flex: 1 1 260px; display: flex; flex-direction: column; gap: 12px; }
  .store {
    display: flex; align-items: center; gap: 12px; min-height: 56px;
    padding: 10px 18px; border-radius: 10px; text-decoration: none;
    transition: filter 0.2s ease;
  }
  .store:hover { filter: brightness(1.12); }
  .store svg { width: 26px; height: 26px; flex: 0 0 auto; }
  .store span { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .store small { font-size: 12px; font-weight: 500; opacity: 0.8; }
  .store strong { font-size: 18px; font-weight: 800; }
  .ios { background: #000; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55); }
  .play { background: #3DDC84; color: #03050a; }
  .qr { flex: 0 0 auto; margin: 0 auto; text-align: center; }
  .qr img {
    display: block; width: 168px; height: 168px; margin: 0 auto 10px;
    border-radius: 10px;
  }
  .qr figcaption { max-width: 190px; font-size: 13px; line-height: 1.45; color: #94a3b8; }
  /* A phone that reached this page cannot scan its own screen. */
  @media (max-width: 560px) and (pointer: coarse) { .qr { display: none; } }
</style>
</head>

  <main>
    <h1>CryptoWeeklies for iPhone</h1>
    <p class="lede">Free, no ads, live alerts on 170+ assets. On Android too.</p>
    <div class="door">
      <div class="stores">
        <!-- The neutral phone glyph, not the Apple logo: Apple permits its
             logo only inside the official badge artwork, used unaltered. -->
        <a class="store ios" href="https://apps.apple.com/us/app/cryptoweeklies-risk-alerts/id6815463434" aria-label="CryptoWeeklies: Risk &amp; Alerts on the App Store, for iPhone and iPad">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6" y="1.5" width="12" height="21" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 4.4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="18.9" r="1.1" fill="currentColor"/></svg>
          <span><small>CryptoWeeklies: Risk &amp; Alerts</small><strong>App Store</strong></span>
        </a>

          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="#00A0FF" d="M1.6 1.4a2 2 0 0 0-.47 1.4v18.4c0 .58.17 1.05.5 1.4l.06.06L12 12.12v-.24z"/><path fill="#FFC107" d="M15.5 8.45 3.34 1.55C2.62 1.15 1.99 1.2 1.6 1.6L12 12z"/><path fill="#00E676" d="m15.4 15.6-3.4-3.48v-.24L15.4 8.4l.08.05 4.1 2.33c1.17.66 1.17 1.75 0 2.42l-4.1 2.33z"/><path fill="#FF3A44" d="M15.5 15.55 12 12 1.6 22.4c.39.4 1.02.45 1.74.05z"/></svg>
          <span><small>CW: BTC, Altcoin &amp; Stock Risk</small><strong>Google Play</strong></span>
        </a>
      </div>
      <figure class="qr">
        <img src="/app/qr.svg" width="168" height="168" alt="QR code that opens cryptoweeklies.com/app on your phone" />
        <figcaption>On a computer? Point your phone's camera here &mdash; it opens the right store for your phone.</figcaption>
      </figure>
    </div>
  </main>

</html>
