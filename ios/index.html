<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get the CryptoWeeklies iOS app</title>

<!-- cryptoweeklies.com/ios: the short link for the iOS app, the way /app was
     for Android. One destination, so unlike /app (which now branches on the
     device and so cannot use one) the meta refresh is the redirect that has
     to work: it runs with scripting disabled and inside the in-app browsers
     social apps use. The script only makes it fractionally faster, and uses
     replace() so this page never lands in history and Back does not bounce
     the reader straight back into it. -->
<meta http-equiv="refresh" content="0; url=https://apps.apple.com/us/app/cryptoweeklies-risk-alerts/id6815463434" />
<link rel="canonical" href="https://apps.apple.com/us/app/cryptoweeklies-risk-alerts/id6815463434" />

<!-- A share of this URL is the whole point of it, and a crawler that does not
     follow the refresh would otherwise render a blank card. -->
<meta property="og:title" content="CryptoWeeklies: Risk &amp; Alerts — iOS app" />
<meta property="og:description" content="Risk scores, market phase and reader-set alerts for crypto, AI and quantum stock universes. Free, no ads, no signals." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://cryptoweeklies.com/ios" />
<meta property="og:image" content="https://cryptoweeklies.com/cw_logo_192_192.png" />
<meta property="og:image:alt" content="CryptoWeeklies logo" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="CryptoWeeklies: Risk &amp; Alerts — iOS app" />
<meta name="twitter:description" content="Risk scores, market phase and reader-set alerts for crypto, AI and quantum stock universes. Free, no ads, no signals." />
<meta name="twitter:image" content="https://cryptoweeklies.com/cw_logo_192_192.png" />
<meta name="twitter:image:alt" content="CryptoWeeklies logo" />

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b1120; color: #e2e8f0; text-align: center; padding: 24px;
  }
  a { color: #38bdf8; }
</style>
</head>
<body>
  <!-- Seen only if both the refresh and the script are unavailable. -->
  <main>
    <p>Taking you to the App Store&hellip;</p>
    <p><a href="https://apps.apple.com/us/app/cryptoweeklies-risk-alerts/id6815463434">CryptoWeeklies: Risk &amp; Alerts on the App Store</a></p>
  </main>
  <script>
    location.replace("https://apps.apple.com/us/app/cryptoweeklies-risk-alerts/id6815463434");
  </script>
</body>
</html>
