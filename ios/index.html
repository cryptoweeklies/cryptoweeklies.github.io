<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get the CryptoWeeklies iOS app</title>

<!-- cryptoweeklies.com/ios: the short link for the iOS app, and now the exact
     twin of /android. Owner, 2026-10-18: it opens the App Store listing and
     nothing else, on every device. From 2026-10-14 it sent only an iPhone or
     iPad on and showed every other browser both stores and a QR code; that
     page is /app's job.

     The redirect normally never reaches this file: _redirects sends /ios at
     Cloudflare's edge with a 302, before any page loads. This page is the
     fallback should that rule ever stop shipping -- one destination, so the
     meta refresh is the redirect that has to work (it runs with scripting off
     and inside social apps' in-app browsers), and the script only makes it
     fractionally faster, with replace() so Back does not bounce the reader
     straight back in. -->
<meta http-equiv="refresh" content="0; url=https://apps.apple.com/us/app/cryptoweeklies-risk-alerts/id6815463434" />
<link rel="canonical" href="https://apps.apple.com/us/app/cryptoweeklies-risk-alerts/id6815463434" />

<!-- A share of this URL is the whole point of it, and a crawler that does not
     follow the refresh would otherwise render a blank card. -->
