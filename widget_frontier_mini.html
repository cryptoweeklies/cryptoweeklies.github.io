<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontier Mini</title>
    <style>
        body {
            margin: 0; padding: 14px 20px;
            background-color: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; height: 100vh; overflow: hidden;
        }
        .lbl-top { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 8px 0; }
        .grid-box {
            width: 100%; height: 115px; background: radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.15) 0%, transparent 70%), #03050a;
            border: 1px dashed #334155; border-radius: 8px; position: relative; overflow: hidden;
        }
        .ax-lbl { position: absolute; font-size: 9px; font-family: monospace; color: #64748b; font-weight: bold; pointer-events: none; }
    </style>
<!-- cw:seo-noindex --><meta name="robots" content="noindex,follow" /><!-- /cw:seo-noindex -->
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center;">


    </div>
    <div class="grid-box">
        <span class="ax-lbl" style="bottom: 4px; left: 6px;">Risk &rarr;</span>
        <span class="ax-lbl" style="top: 6px; left: 6px;">Return &uarr;</span>
        <div style="position: absolute; left: 79.92184663304064%; top: 0; bottom: 0; width: 1px; border-left: 1px dotted #334155;" title="Median Volatility"></div>
        <div style="position: absolute; top: 42.54215476922328%; left: 0; right: 0; height: 1px; border-top: 1px dotted #334155;" title="Median Return"></div>
        
        <div style="position: absolute; left: 45.222365280969974%; top: 36.79127666520702%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; pointer-events: none;">
            <div style="width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; border: 1px solid #fff;"></div>
            <span style="font-size: 9px; font-family: monospace; font-weight: 900; color: #fff; margin-top: 2px; text-shadow: 0 1px 3px #000;">BTC</span>
        </div>
        <div style="position: absolute; left: 62.5885085400793%; top: 44.47591530030015%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; pointer-events: none;">
            <div style="width: 10px; height: 10px; background-color: #3b82f6; border-radius: 50%; box-shadow: 0 0 8px #3b82f6; border: 1px solid #fff;"></div>
            <span style="font-size: 9px; font-family: monospace; font-weight: 900; color: #fff; margin-top: 2px; text-shadow: 0 1px 3px #000;">ETH</span>
        </div>
        <div style="position: absolute; left: 77.07628551314839%; top: 17.671163870749126%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; pointer-events: none;">
            <div style="width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; border: 1px solid #fff;"></div>
            <span style="font-size: 9px; font-family: monospace; font-weight: 900; color: #fff; margin-top: 2px; text-shadow: 0 1px 3px #000;">XRP</span>
        </div>
        <div style="position: absolute; left: 85.80732991413707%; top: 27.002510784790786%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; pointer-events: none;">
            <div style="width: 10px; height: 10px; background-color: #facc15; border-radius: 50%; box-shadow: 0 0 8px #facc15; border: 1px solid #fff;"></div>
            <span style="font-size: 9px; font-family: monospace; font-weight: 900; color: #fff; margin-top: 2px; text-shadow: 0 1px 3px #000;">SOL</span>
        </div>
        <div style="position: absolute; left: 50.307479052974365%; top: 37.7061145979562%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; pointer-events: none;">
            <div style="width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; border: 1px solid #fff;"></div>
            <span style="font-size: 9px; font-family: monospace; font-weight: 900; color: #fff; margin-top: 2px; text-shadow: 0 1px 3px #000;">BNB</span>
        </div>
    </div>
</body>
</html>
