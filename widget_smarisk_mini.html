<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMARisk Mini</title>
    <style>
        body {
            margin: 0; padding: 14px 20px;
            background-color: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; height: 100vh; overflow: hidden;
        }
        .lbl-top { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 12px 0; text-align: center; }
        .dial-container { display: flex; justify-content: space-around; align-items: center; width: 100%; font-family: monospace; }
        .dial { display: flex; flex-direction: column; align-items: center; }
        .val { font-size: 26px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
        .sym { font-size: 11px; color: #10b981; font-family: -apple-system, sans-serif; font-weight: bold; }
        .divider { height: 35px; width: 1px; background: #334155; }
    </style>
<!-- cw:seo-noindex --><meta name="robots" content="noindex,follow" /><!-- /cw:seo-noindex -->
</head>
<body>
    <p class="lbl-top">SMA Deviation Bands (20W Baseline)</p>
    <div class="dial-container">
        <div class="dial">
            <span class="val" style="color: #ef4444;">0.99</span>
            <span class="sym">BTC RISK</span>
        </div>
        <div class="divider"></div>
        <div class="dial">
            <span class="val" style="color: #ef4444;">0.98</span>
            <span class="sym">ETH RISK</span>
        </div>
    </div>
</body>
</html>
