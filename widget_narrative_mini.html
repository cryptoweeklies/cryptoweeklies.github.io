<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrative Mini</title>
    <style>
        body {
            margin: 0; padding: 14px 20px;
            background-color: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; height: 100vh; overflow: hidden;
        }
        .lbl-top { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 12px 0; display: flex; justify-content: space-between; }
        .cloud-wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; font-family: monospace; font-weight: bold; }
    </style>
<!-- cw:seo-noindex --><meta name="robots" content="noindex,follow" /><!-- /cw:seo-noindex -->
</head>
<body>
    <div class="lbl-top">
        <span>7D Social Frequency Pulse</span>
        <span style="color: #eab308;">Risk: 39%</span>
    </div>
    <div class="cloud-wrap">
        <span style="background: rgba(59, 130, 246, 0.15); border: 1px solid #3b82f6; color: #3b82f6; padding: 4px 12px; border-radius: 20px; font-size: 16px; box-shadow: 0 0 8px rgba(59, 130, 246, 0.15);">#Bitcoin</span><span style="background: rgba(168, 85, 247, 0.15); border: 1px solid #a855f7; color: #a855f7; padding: 4px 12px; border-radius: 20px; font-size: 13px; box-shadow: 0 0 8px rgba(168, 85, 247, 0.15);">#Bullish</span><span style="background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #22c55e; padding: 4px 12px; border-radius: 20px; font-size: 11px; box-shadow: 0 0 8px rgba(34, 197, 94, 0.15);">#Solana</span><span style="background: rgba(234, 179, 8, 0.15); border: 1px solid #eab308; color: #eab308; padding: 4px 12px; border-radius: 20px; font-size: 11px; box-shadow: 0 0 8px rgba(234, 179, 8, 0.15);">#Bearish</span><span style="background: rgba(236, 72, 153, 0.15); border: 1px solid #ec4899; color: #ec4899; padding: 4px 12px; border-radius: 20px; font-size: 11px; box-shadow: 0 0 8px rgba(236, 72, 153, 0.15);">#Xrp</span><span style="background: rgba(0, 212, 170, 0.15); border: 1px solid #00d4aa; color: #00d4aa; padding: 4px 12px; border-radius: 20px; font-size: 11px; box-shadow: 0 0 8px rgba(0, 212, 170, 0.15);">#Cardano</span><span style="background: rgba(249, 115, 22, 0.15); border: 1px solid #f97316; color: #f97316; padding: 4px 12px; border-radius: 20px; font-size: 11px; box-shadow: 0 0 8px rgba(249, 115, 22, 0.15);">#Cycle</span><span style="background: rgba(96, 165, 250, 0.15); border: 1px solid #60a5fa; color: #60a5fa; padding: 4px 12px; border-radius: 20px; font-size: 11px; box-shadow: 0 0 8px rgba(96, 165, 250, 0.15);">#Stellar</span>
    </div>
</body>
</html>
