        // --- TRUE AABB EJECTION MATH ---
        let bounds = { legend: null };
        function updateBounds() {
            let legEl = document.getElementById("widget-legend");
            if(legEl) {
                let rect = legEl.getBoundingClientRect();
                bounds.legend = { left: rect.left - 15, right: rect.right + 15, top: rect.top - 15, bottom: rect.bottom + 15 };
            }
        }
        setTimeout(updateBounds, 100);

        function resolveRectCollision(d, rect) {
            if (!rect) return;
            let r = d.radius + 3;
            // If bounding box overlaps
            if (d.x > rect.left - r && d.x < rect.right + r && d.y > rect.top - r && d.y < rect.bottom + r) {
                let overlapLeft = (d.x + r) - rect.left;
                let overlapRight = rect.right - (d.x - r);
                let overlapTop = (d.y + r) - rect.top;
                let overlapBottom = rect.bottom - (d.y - r);

                let minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

                if (minOverlap === overlapLeft) { d.x = rect.left - r; d.vx *= -0.8; }
                else if (minOverlap === overlapRight) { d.x = rect.right + r; d.vx *= -0.8; }
                else if (minOverlap === overlapTop) { d.y = rect.top - r; d.vy *= -0.8; }
                else if (minOverlap === overlapBottom) { d.y = rect.bottom + r; d.vy *= -0.8; }
            }
        }

        sim.on("tick", () => {
            let t=Date.now()/1000;
            data.forEach((d,i)=>{
                d.vx+=Math.sin(t+i)*0.05; d.vy+=Math.cos(t+i)*0.05;

                let r=d.radius+3;
                if(d.x<r){d.x=r;d.vx*=-0.8;}else if(d.x>width-r){d.x=width-r;d.vx*=-0.8;}
                if(d.y<r){d.y=r;d.vy*=-0.8;}else if(d.y>height-r){d.y=height-r;d.vy*=-0.8;}

                resolveRectCollision(d, bounds.legend);
            });
            node.attr("transform", d=>`translate(${d.x},${d.y})`);
        });

        let actF = null;

        }

        window.addEventListener('resize', () => { updateBounds(); });
