        function resolveRectCollision(d, rect) {
            if (!rect) return;
            let r = d.radius + 3;
            // If bounding box overlaps
            if (d.x > rect.left - r && d.x < rect.right + r && d.y > rect.top - r && d.y < rect.bottom + r) {
                let overlapLeft = (d.x + r) - rect.left;
                let overlapRight = rect.right - (d.x - r);
                let overlapTop = (d.y + r) - rect.top;
                let overlapBottom = rect.bottom - (d.y - r);

                let minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

                if (minOverlap === overlapLeft) { d.x = rect.left - r; d.vx *= -0.8; }
                else if (minOverlap === overlapRight) { d.x = rect.right + r; d.vx *= -0.8; }
                else if (minOverlap === overlapTop) { d.y = rect.top - r; d.vy *= -0.8; }
                else if (minOverlap === overlapBottom) { d.y = rect.bottom + r; d.vy *= -0.8; }
            }
        }
