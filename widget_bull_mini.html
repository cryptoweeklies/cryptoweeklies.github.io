<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bull Targets Mini</title>
    <style>
        body {
            margin: 0; padding: 14px 20px;
            background-color: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; height: 100vh; overflow: hidden;
        }
        .lbl-top { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 12px 0; display: flex; justify-content: space-between; }
        .row-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #1e293b; font-family: monospace; font-size: 13px; }
        .row-item:last-child { border-bottom: none; }
        .sym { color: #cbd5e1; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .val { color: #4ade80; font-weight: 900; font-size: 15px; background: #0f172a; padding: 2px 8px; border-radius: 4px; border: 1px solid #334155; box-shadow: 0 0 8px rgba(74, 222, 128, 0.15); }
    </style>
<!-- cw:seo-noindex --><meta name="robots" content="noindex,follow" /><!-- /cw:seo-noindex -->
</head>
<body>
    <div class="row-item">
        <span class="sym"><span>●</span> Bitcoin (BTC)</span>
        <span class="val">$128,864</span>
    </div>
    <div class="row-item">
        <span class="sym"><span>●</span> Ethereum (ETH)</span>
        <span class="val">$6,799</span>
    </div>
    <div class="row-item">
        <span class="sym"><span>●</span> Solana (SOL)</span>
        <span class="val">$410</span>
    </div>
</body>
</html>
