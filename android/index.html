<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get the CryptoWeeklies Android app</title>

<!-- cryptoweeklies.com/android: the short link for the Android app, the
     exact twin of /ios. One destination, so unlike /app (which branches on the
     device and so cannot use one) the meta refresh is the redirect that has
     to work: it runs with scripting disabled and inside the in-app browsers
     social apps use. The script only makes it fractionally faster, and uses
     replace() so this page never lands in history and Back does not bounce
     the reader straight back into it. -->
<!-- Source tags (2026-10-19). A link tagged ?s=<source> (yt_desc, yt_pinned, share...)
     reaches Play with that source as its install referrer -- Play Console reads it under
     Store performance > Traffic sources > UTM -- and is first counted by the site's
     Cloudflare beacon, which records the visit at /android/from/<source>/ (the path is
     rewritten in place; nothing navigates there). An untagged link goes straight on as
     before, and a browser without scripting takes the <noscript> refresh. -->
<script>
  (function () {
    var play = "https://play.google.com/store/apps/details?id=com.cryptoweeklies.app";
    var m = /[?&]s=([A-Za-z0-9_-]{1,40})(?:&|$)/.exec(location.search);
    if (!m) {
      document.write('<meta http-equiv="refresh" content="0; url=' + play + '" />');
      return;
    }
    var source = m[1].toLowerCase();
    // The body script reads this, since the path rewrite below empties location.search.
    document.documentElement.setAttribute("data-cw-tagged", "");
    var tagged = play + "&referrer=" + encodeURIComponent("utm_source=" + source + "&utm_medium=cw_link");
    // The safety net, should the redirect below never run.
    document.write('<meta http-equiv="refresh" content="2; url=' + tagged + '" />');
    try { history.replaceState(null, "", "/android/from/" + source + "/"); } catch (e) {}
    var gone = false;
    function go() { if (!gone) { gone = true; location.replace(tagged); } }
    // Long enough for the beacon to load and count the visit; never longer than 1.2s.
    window.addEventListener("load", function () { setTimeout(go, 300); });
    setTimeout(go, 1200);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.cryptoweeklies.app" /></noscript>
<link rel="canonical" href="https://play.google.com/store/apps/details?id=com.cryptoweeklies.app" />

  <!-- Seen only if both the refresh and the script are unavailable. -->

    <p>Taking you to Google Play&hellip;</p>

    // A tagged link is forwarded by the head script, after it is counted.
