# GitHub Pages runs Jekyll, and Jekyll skips paths beginning with a dot. That
# silently excluded /.well-known/assetlinks.json from the built site: the URL
# answered 200 with the site's HTML rather than the JSON, so Android could never
# verify the App Link and every cryptoweeklies.com link kept opening the browser.
#
# Including the one directory rather than adding .nojekyll, so nothing else about
# how the site is built changes.
include:
  - .well-known
