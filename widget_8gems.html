<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8Gems Mini</title>
<style>
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; color:#fff; }
    body { padding:14px 16px 12px; display:flex; flex-direction:column; justify-content:center; gap:10px; font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; min-width:0; }
    .eyebrow { color:#94a3b8; font:800 10px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase; }
    .score-row { display:flex; align-items:baseline; gap:7px; margin-top:3px; white-space:nowrap; }
    .score { color:#a855f7; font:950 27px/1 ui-monospace,SFMono-Regular,Menlo,monospace; text-shadow:0 0 14px #a855f766; }
    .unit { color:#64748b; font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .status { max-width:48%; color:#a855f7; border:1px solid #a855f7; border-radius:4px; padding:3px 7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:900 10px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase; box-shadow:0 0 12px #a855f72e; }
    .meta { display:flex; justify-content:space-between; gap:12px; color:#94a3b8; font:700 10px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .meta strong { color:#fff; }
    .track { display:flex; width:100%; height:8px; overflow:hidden; border-radius:4px; background:#1e293b; box-shadow:inset 0 0 0 1px rgba(255,255,255,.05); }
    .segment { display:block; height:100%; min-width:2px; }
    .legend { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; }
    .zone { min-width:0; color:#64748b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:700 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .zone i { display:inline-block; width:6px; height:6px; margin-right:4px; border-radius:50%; box-shadow:0 0 6px currentColor; }
    .zone b { color:#cbd5e1; }
    @media (max-width:360px) {
        body { padding-inline:12px; }
        .legend { grid-template-columns:repeat(2,minmax(0,1fr)); row-gap:5px; }
        .status { max-width:44%; }
    }
</style>
<!-- cw:seo-noindex --><meta name="robots" content="noindex,follow" /><!-- /cw:seo-noindex -->
</head>
<body>
    <div class="top">
        <div>
            <div class="eyebrow">Galaxy Heat</div>
            <div class="score-row"><span class="score">54.2</span><span class="unit">/100</span></div>
        </div>
        <span class="status">Balanced Rotation</span>
    </div>
    <div class="meta">
        <span>Top gem <strong>UNI</strong></span>
        <span>Confluence <strong>79/100</strong></span>
    </div>
    <div class="track" aria-label="8Gems zone distribution"><span class="segment" title="Golden Breakout: 3" style="width:15.789%;background:#eab308"></span><span class="segment" title="Deep Accumulation: 6" style="width:31.579%;background:#3b82f6"></span><span class="segment" title="Euphoria: 7" style="width:36.842%;background:#a855f7"></span><span class="segment" title="Value Trap: 3" style="width:15.789%;background:#ef4444"></span></div>
    <div class="legend"><span class="zone"><i style="background:#eab308"></i>Breakout <b>3</b></span><span class="zone"><i style="background:#3b82f6"></i>Accumulation <b>6</b></span><span class="zone"><i style="background:#a855f7"></i>Euphoria <b>7</b></span><span class="zone"><i style="background:#ef4444"></i>Value Trap <b>3</b></span></div>
</body>
</html>
