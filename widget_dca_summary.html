        .sat-pill-rect { stroke-width: 1.5px; rx: 6px; }
        .sat-pill-text { font-family: monospace; font-size: 9px; font-weight: 900; text-anchor: middle; pointer-events: none; }

        .tt-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .mini-chart { height: 190px; width: 100%; background: #03050a; border: 1px solid #1e293b; border-radius: 8px; margin-top: 10px; }
        .mini-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .mini-pill { border: 1px solid currentColor; border-radius: 999px; padding: 2px 7px; font-size: 9px; font-weight: 900; text-transform: uppercase; }

            .force("collide", d3.forceCollide().radius(d => d.radius + 26).iterations(4).strength(0.85))
            .force("center", d3.forceCenter(width / 2, height / 2).strength(0.05));

        const node = svg.append("g").selectAll("g").data(galaxyNodes).join("g").attr("class", "bubble-node")
            .call(d3.drag()
                .on("start", (e,d) => { if(!e.active) simulation.alphaTarget(0.1).restart(); d.fx=d.x; d.fy=d.y; })
                .on("drag", (e,d) => { d.fx=e.x; d.fy=e.y; })
                .on("end", (e,d) => { if(!e.active) simulation.alphaTarget(0.01); d.fx=null; d.fy=null; })
            );

        node.on("click", function(e, d) {
            if (e.defaultPrevented) return;
            if (window.parent && window.parent !== window && typeof window.parent.openDcaPlannerFromSummary === "function") {
                window.parent.openDcaPlannerFromSummary(d.id);
            } else {
                window.location.href = `widget_gravity_dca.html?asset=${encodeURIComponent(d.id)}`;
            }
        });

        node.append("circle")
            .attr("r", d => d.radius)
            .attr("fill", "#070a13")
            .attr("stroke", d => d.todayAction.color)
            .attr("stroke-width", 2.5)
            .style("filter", d => `drop-shadow(0px 0px 10px ${d.todayAction.color})`);

        node.append("text").attr("class", "t-regime")
            .text(d => d.todayAction.text)
            .style("font-size", d => Math.max(8, Math.min(11, d.radius / 8)) + "px")
            .attr("fill", d => d.todayAction.color)
            .attr("y", d => -d.radius * 0.42);

        node.append("text").attr("class", "t-sym")
            .text(d => d.id)
            .style("font-size", d => Math.max(14, d.radius / 3.2) + "px")
            .attr("y", -3);

        const currFmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
        node.append("text").attr("class", "t-mult")
            .text(d => formatMultiplier(d.paycheckMult))
            .style("font-size", d => Math.max(18, d.radius / 2.7) + "px")
            .attr("y", d => d.radius * 0.30);

        node.append("text").attr("class", "t-unit")
            .text("PAYCHECK")
            .style("font-size", d => Math.max(8, d.radius / 9) + "px")
            .attr("y", d => d.radius * 0.47);

        const tooltip = d3.select("#tooltip");
        node.on("mouseover", function(e, d) {
            d3.selectAll(".bubble-node").transition().duration(200).style("opacity", 0.25);
            d3.select(this).transition().duration(200).style("opacity", 1);
            d3.select(this).select("circle").attr("stroke-width", 5).style("filter", d => `drop-shadow(0px 0px 18px ${d.todayAction.color})`);

            tooltip.style("opacity", 1)
                .html(`
                    <div class="tt-hdr">
                        <span>${d.id} Spot Regime</span>
                        <span style="color:${d.todayAction.color};">${formatMultiplier(d.paycheckMult)} paycheck</span>
                    </div>
                    <div class="tt-row" style="background:#0b0e14; padding:5px 8px; border-radius:6px; border:1px solid ${d.todayAction.color}; color:${d.todayAction.color}; font-weight:900; justify-content:center;">${d.todayAction.text}</div>
                    <div class="mini-chart" id="mini-chart"></div>
                    <div class="mini-legend">
                        <span class="mini-pill" style="color:#3b82f6;">Crash</span>
                        <span class="mini-pill" style="color:#22c55e;">Dip</span>
                        <span class="mini-pill" style="color:#facc15;">Neutral</span>
                        <span class="mini-pill" style="color:#f97316;">Suppressed</span>
                        <span class="mini-pill" style="color:#ef4444;">Hoard</span>
                    </div>
                `)
                .style("left", (e.pageX > window.innerWidth - 390 ? e.pageX - 390 : e.pageX + 15) + "px")
                .style("top", (e.pageY - 60) + "px");
            drawMiniChart(d);
        }).on("mouseout", function(e, d) {
            d3.selectAll(".bubble-node").transition().duration(200).style("opacity", 1);
            d3.select(this).select("circle").attr("stroke-width", 2.5).style("filter", `drop-shadow(0px 0px 10px ${d.todayAction.color})`);
            tooltip.style("opacity", 0);
        });

        function drawMiniChart(nodeData) {
            const data = nodeData.trajectory || [];
            const box = document.getElementById("mini-chart");
            if (!box || data.length === 0) return;
            box.innerHTML = "";

            const margin = { top: 12, right: 14, bottom: 22, left: 44 };
            const width = box.clientWidth - margin.left - margin.right;
            const height = box.clientHeight - margin.top - margin.bottom;
            const parseDate = d3.timeParse("%Y-%m-%d");
            data.forEach(d => d.pDate = d.pDate || parseDate(d.date));

            const x = d3.scaleTime().domain(d3.extent(data, d => d.pDate)).range([0, width]);
            const y = d3.scaleLinear()
                .domain(d3.extent(data, d => d.price))
                .nice()
                .range([height, 0]);

            const svg = d3.select(box).append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
              .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            svg.append("g")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x).ticks(4).tickSizeOuter(0))
                .style("color", "#475569")
                .style("font-family", "monospace");

            svg.append("g")
                .call(d3.axisLeft(y).ticks(4).tickFormat(v => "$" + d3.format(".2s")(v)).tickSizeOuter(0))
                .style("color", "#64748b")
                .style("font-family", "monospace");

            svg.append("path")
                .datum(data)
                .attr("fill", "none")
                .attr("stroke", "#94a3b8")
                .attr("stroke-width", 1.6)
                .attr("d", d3.line().x(d => x(d.pDate)).y(d => y(d.price)));

            svg.selectAll("circle.regime-dot")
                .data(data)
                .join("circle")
                .attr("class", "regime-dot")
                .attr("cx", d => x(d.pDate))
                .attr("cy", d => y(d.price))
                .attr("r", 2.7)
                .attr("fill", d => d.pill.color)
                .attr("stroke", "#000")
                .attr("stroke-width", 0.8);
        }

        simulation.on("tick", () => {
            let t = Date.now() / 1000;
            galaxyNodes.forEach((d, i) => {
                d.vx += (Math.sin(t + i) * 0.02) + (Math.random() - 0.5) * 0.015;
                d.vy += (Math.cos(t + i) * 0.02) + (Math.random() - 0.5) * 0.015;

                let pad = d.radius + 26;
                if (d.x < pad) { d.x = pad; d.vx *= -0.8; }
                if (d.x > width - pad) { d.x = width - pad; d.vx *= -0.8; }
                if (d.y < pad) { d.y = pad; d.vy *= -0.8; }
                if (d.y > height - pad) { d.y = height - pad; d.vy *= -0.8; }
            });
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        window.addEventListener("resize", () => {
            width = container.clientWidth || window.innerWidth || 800;
            height = container.clientHeight || window.innerHeight || 500;
            svg.attr("width", width).attr("height", height);
            simulation.force("center", d3.forceCenter(width / 2, height / 2).strength(0.05));
            simulation.alpha(0.3).restart();
        });
    </script>
</body>
</html>
