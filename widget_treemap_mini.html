<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treemap Mini</title>
    <style>
        body {
            margin: 0; padding: 14px 20px;
            background-color: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; height: 100vh; overflow: hidden;
        }
        .lbl-top { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 8px 0; }
        .tm-container { display: flex; gap: 8px; height: 110px; font-family: monospace; font-weight: bold; }
        .tm-box { border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: transform 0.2s; }
        .tm-box:hover { transform: scale(0.98); }
        .sym { font-size: 14px; }
        .val { font-size: 11px; font-weight: normal; margin-top: 2px; }
    </style>
<!-- cw:seo-noindex --><meta name="robots" content="noindex,follow" /><!-- /cw:seo-noindex -->
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <p class="lbl-top">24H</p>
    </div>
    <div class="tm-container">
        <div class="tm-box" style="flex: 5 1 0; background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #4ade80;">
            <span class="sym">BTC</span>
            <span class="val">+0.1%</span>
        </div>
        <div style="flex: 4 1 0; display: flex; flex-direction: column; gap: 8px;">
            <div class="tm-box" style="flex: 2 1 0; background: rgba(148, 163, 184, 0.2); border: 1px solid #94a3b8; color: #cbd5e1;">
                <span class="sym" style="font-size: 13px;">ETH</span>
                <span class="val" style="font-size: 10px;">0.0%</span>
            </div>
            <div style="flex: 1 1 0; display: flex; gap: 8px;">
                <div class="tm-box" style="flex: 1 1 0; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171;">
                    <span class="sym" style="font-size: 11px;">SOL</span>
                    <span class="val" style="font-size: 9px;">-0.2%</span>
                </div>
                <div style="flex: 1 1 0; display: flex; gap: 8px;">
                <div class="tm-box" style="flex: 1 1 0; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171;">
                    <span class="sym" style="font-size: 11px;">XRP</span>
                    <span class="val" style="font-size: 9px;">-1.3%</span>
                </div>
                <div class="tm-box" style="flex: 1 1 0; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171;">
                    <span class="sym" style="font-size: 11px;">BNB</span>
                    <span class="val" style="font-size: 9px;">-0.4%</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
