<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get the CryptoWeeklies app — iPhone and Android</title>

<!-- One link for both stores. It was a meta refresh straight to Google Play,
     which sent every iPhone reader to a store they cannot install from. A
     meta refresh cannot branch on the device, so it is gone: the script below
     sends iOS to the App Store and Android to Google Play, using replace()
     so this page never lands in history and Back does not bounce the reader
     straight back into it. Everything else -- a desktop, or a browser with
     scripting off -- stays on this page and sees both stores, which is the
     right answer when there is no single right store.

     The canonical is this page, not either listing: it no longer resolves to
     exactly one of them. -->
<link rel="canonical" href="https://cryptoweeklies.com/app/" />

<!-- A share of this URL is the whole point of it, and a crawler that does not
     run the script would otherwise render a blank card. Same image and card
     type the site's index.html already uses. -->
<meta property="og:title" content="CryptoWeeklies — risk scores and alerts for iPhone and Android" />
<meta property="og:description" content="Risk scores, market phase and reader-set alerts for crypto, AI and quantum stock universes. Free, no ads, no signals." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://cryptoweeklies.com/app" />
<meta property="og:image" content="https://cryptoweeklies.com/cw_logo_192_192.png" />
<meta property="og:image:alt" content="CryptoWeeklies logo" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="CryptoWeeklies — risk scores and alerts for iPhone and Android" />
<meta name="twitter:description" content="Risk scores, market phase and reader-set alerts for crypto, AI and quantum stock universes. Free, no ads, no signals." />
<meta name="twitter:image" content="https://cryptoweeklies.com/cw_logo_192_192.png" />
<meta name="twitter:image:alt" content="CryptoWeeklies logo" />

<script>
  (function () {
    var ua = navigator.userAgent || '';
    // iPadOS 13+ reports itself as a Mac; a Mac with a touch screen is an iPad.
    var ios = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios) {
      location.replace("https://apps.apple.com/us/app/cryptoweeklies-risk-alerts/id6815463434");
    } else if (/Android/i.test(ua)) {
      location.replace("https://play.google.com/store/apps/details?id=com.cryptoweeklies.app");
    }
  })();
</script>

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b1120; color: #e2e8f0; text-align: center; padding: 24px;
  }
  h1 { font-size: 1.35rem; margin: 0 0 8px; }
  p { margin: 0 0 22px; color: #94a3b8; }
  .stores { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .stores a {
    display: inline-block; min-width: 200px; padding: 12px 20px; border-radius: 10px;
    font-weight: 700; text-decoration: none;
  }
  .ios { background: #000; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55); }
  .play { background: #3DDC84; color: #03050a; }
</style>
</head>
<body>
  <main>
    <h1>Get CryptoWeeklies on your phone</h1>
    <p>Free, no ads, live alerts on 170+ assets.</p>
    <div class="stores">
      <a class="ios" href="https://apps.apple.com/us/app/cryptoweeklies-risk-alerts/id6815463434">CryptoWeeklies: Risk &amp; Alerts on the App Store</a>
      <a class="play" href="https://play.google.com/store/apps/details?id=com.cryptoweeklies.app">CW: Crypto and Stock Alerts on Google Play</a>
    </div>
  </main>
</body>
</html>
