<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get the CryptoWeeklies Android app</title>

<!-- The redirect. The meta refresh is the one that has to work: it runs with
     scripting disabled and inside the in-app browsers that social apps use.
     The script below only makes it fractionally faster, and uses replace()
     rather than assigning href so this page never lands in history and Back
     does not bounce the reader straight back into it. -->
<meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.cryptoweeklies.app" />
<link rel="canonical" href="https://play.google.com/store/apps/details?id=com.cryptoweeklies.app" />

<!-- A share of this URL is the whole point of it, and a crawler that does not
     follow the refresh would otherwise render a blank card. Same image and
     card type the site's index.html already uses. -->
<meta property="og:title" content="CW: Crypto and Stock Alerts — Android app" />
<meta property="og:description" content="Risk scores, market phase and reader-set alerts for crypto, AI and quantum stock universes. Free, no ads, no signals." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://cryptoweeklies.com/app" />
<meta property="og:image" content="https://cryptoweeklies.com/cw_logo_192_192.png" />
<meta property="og:image:alt" content="CryptoWeeklies logo" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="CW: Crypto and Stock Alerts — Android app" />
<meta name="twitter:description" content="Risk scores, market phase and reader-set alerts for crypto, AI and quantum stock universes. Free, no ads, no signals." />
<meta name="twitter:image" content="https://cryptoweeklies.com/cw_logo_192_192.png" />
<meta name="twitter:image:alt" content="CryptoWeeklies logo" />

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b1120; color: #e2e8f0; text-align: center; padding: 24px;
  }
  a { color: #38bdf8; }
</style>
</head>
<body>
  <!-- Seen only if both the refresh and the script are unavailable. -->
  <main>
    <p>Taking you to Google Play&hellip;</p>
    <p><a href="https://play.google.com/store/apps/details?id=com.cryptoweeklies.app">CW: Crypto and Stock Alerts on Google Play</a></p>
  </main>
  <script>
    location.replace("https://play.google.com/store/apps/details?id=com.cryptoweeklies.app");
  </script>
</body>
</html>
