<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Gems Mini</title>
    <style>
        body {
            margin: 0; padding: 14px 20px;
            background-color: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; height: 100vh; overflow: hidden;
        }
        .lbl-top { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 10px 0; }
        .q-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1e293b; font-family: monospace; font-size: 12px; }
        .q-row:last-child { border-bottom: none; }
        .q-lbl { font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .q-val { font-weight: 900; background: #0f172a; padding: 2px 6px; border-radius: 4px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="q-row">
        <span class="q-lbl" style="color: #eab308;">● Golden Breakout (11)</span>
        <span class="q-val" style="color: #facc15;">VET (+114.8%)</span>
    </div>
    <div class="q-row">
        <span class="q-lbl" style="color: #ef4444;">● Euphoria (13)</span>
        <span class="q-val" style="color: #f87171;">UNI (+235.8%)</span>
    </div>
    <div class="q-row">
        <span class="q-lbl" style="color: #3b82f6;">● Deep Accumulation (13)</span>
        <span class="q-val" style="color: #60a5fa;">ICP (+50.8%)</span>
    </div>
    <div class="q-row">
        <span class="q-lbl" style="color: #a855f7;">● Value Trap (11)</span>
        <span class="q-val" style="color: #c084fc;">OP (+49.2%)</span>
    </div>
</body>
</html>
