                    <div class="tt-row"><span class="tt-lbl">Cycle TWAP ('23):</span> <span class="tt-val">$${formatPrice(d.TWAP_Price)}</span></div>
                    <div class="tt-row"><span class="tt-lbl">90D Momentum:</span> <span class="tt-val">${(d.Return_90D > 0 ? '+' : '') + d.Return_90D.toFixed(1)}%</span></div>
                    <div class="tt-row"><span class="tt-lbl">Impact Score:</span> <span class="tt-val">${d.Composite_Impact.toFixed(1)}</span></div>
                `);
                tooltip.style("opacity", 1).style("border-color", d.Color);

                let ttNode = tooltip.node();
                let ttWidth = ttNode.offsetWidth || 240; let ttHeight = ttNode.offsetHeight || 140;

                let ex = event.pageX; let ey = event.pageY;
                if (event.touches && event.touches.length > 0) { ex = event.touches[0].pageX; ey = event.touches[0].pageY; }
                if (!ex || !ey) { ex = d.x + window.innerWidth/2; ey = d.y + window.innerHeight/2; }

                let x = ex + 15;
                let y = ey + 15;

                let scrollX = window.scrollX || window.pageXOffset || 0;
                let scrollY = window.scrollY || window.pageYOffset || 0;

                if (x + ttWidth > window.innerWidth + scrollX) {
                    x = ex - ttWidth - 15;
                }
                if (x < scrollX) { x = scrollX + 10; }

                if (y + ttHeight > window.innerHeight + scrollY) {
                    y = ey - ttHeight - 15;
                }
                if (y < scrollY) { y = scrollY + 10; }

                tooltip.style("left", x + "px").style("top", y + "px");
            }

            node.on("mouseover", function(event, d) {
                if (d3.select(this).style("opacity") < 1) return;
                showTooltip(event, d, this);
            })
            .on("mousemove", function(event, d) {
                if (activeTooltip !== d.Ticker) showTooltip(event, d, this);
            })
            .on("mouseout", function(event, d) {
                if (activeTooltip === d.Ticker) return;
                d3.select(this).select("circle").attr("stroke-width", 2); tooltip.style("opacity", 0);
            });

            node.on("click", function(event, d) {
                event.stopPropagation();
                activeTooltip = d.Ticker;
                showTooltip(event, d, this);

                window.parent.postMessage({
                    action: 'open_asset_menu',
                    ticker: d.Ticker,
                    stats: {
                        color: d.Color,
                        quadrant: d.Quadrant,
                        risk_score: d.Composite_Risk.toLocaleString(undefined, {maximumFractionDigits: 1}),
                        gravity: d.Gravity_Score.toFixed(1),
                        dominance: d.Dominance_Multiplier.toFixed(2),
                        twap: formatPrice(d.TWAP_Price),
                        momentum: (d.Return_90D > 0 ? '+' : '') + d.Return_90D.toFixed(1) + '%',
                        impact: d.Composite_Impact.toFixed(1)
                    }
                }, '*');
            });

            svg.on("click", function() {
                activeTooltip = null;
                d3.selectAll(".bubble-node circle").attr("stroke-width", 2);
                tooltip.style("opacity", 0);
            });

            let activeFilter = null;
            window.toggleFilter = function(zone) {
                if (activeFilter === zone) {
                    activeFilter = null;
                    d3.selectAll('.leg-item').classed('dimmed', false);
                    d3.selectAll('.bubble-node').transition().duration(400).style('opacity', 1);
                } else {
                    activeFilter = zone;
                    d3.selectAll('.leg-item').classed('dimmed', function() { return this.getAttribute('data-zone') !== zone; });
                    d3.selectAll('.bubble-node').transition().duration(400).style('opacity', function(d) { return d.Quadrant === zone ? 1 : 0.05; });
                }
            }

            function triggerPulse() {
                data.forEach(d => {
                    d.vx += (Math.random() - 0.5) * 0.5;
                    d.vy += (Math.random() - 0.5) * 0.5;
                });
                simulation.alpha(0.05).restart();
                setTimeout(triggerPulse, 2500 + Math.random() * 1500);
            }
            setTimeout(triggerPulse, 2500 + Math.random() * 1500);

            setTimeout(() => {
                isCentered = true;
                let forceXStrength = width < 600 ? 0.028 : 0.015;
                let forceYStrength = width < 600 ? 0.010 : 0.008;
                simulation.force("x", d3.forceX(width * 0.5).strength(forceXStrength));
                simulation.force("y", d3.forceY(height * 0.5).strength(forceYStrength));
                simulation.alpha(0.2).restart();
            }, 500);

            let legendEl = document.getElementById("widget-legend");
            let legX = width, legY = height;

            function updateLegendBounds() {
                if (legendEl) {
                    legX = width - (legendEl.offsetWidth + 25);
                    legY = height - (legendEl.offsetHeight + 25);
                }
            }
            updateLegendBounds();

            simulation.on("tick", () => {
                let time = Date.now() / 1000;
                data.forEach((d, i) => {
                    d.vx += (Math.sin(time + i) * 0.05) + (Math.random() - 0.5) * 0.03;
                    d.vy += (Math.cos(time + i) * 0.05) + (Math.random() - 0.5) * 0.03;

                    let r = d.radius + 2;

                    if (d.x < r) { d.x = r; d.vx *= -0.8; }
                    else if (d.x > width - r) { d.x = width - r; d.vx *= -0.8; }

                    if (d.y < r) { d.y = r; d.vy *= -0.8; }
                    else if (d.y > height - r) { d.y = height - r; d.vy *= -0.8; }

                    if (legendEl && d.x + r > legX && d.y + r > legY) {
                        let overlapX = (d.x + r) - legX;
                        let overlapY = (d.y + r) - legY;

                        if (overlapX < overlapY) {
                            d.x = legX - r;
                            d.vx *= -0.8;
                        } else {
                            d.y = legY - r;
                            d.vy *= -0.8;
                        }
                    }
                });
                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });

            function dragstarted(event, d) { if (!event.active) simulation.alphaTarget(0.05).restart(); d.fx = d.x; d.fy = d.y; }
            function dragged(event, d) { d.fx = Math.max(d.radius, Math.min(width - d.radius, event.x)); d.fy = Math.max(d.radius, Math.min(height - d.radius, event.y)); }
            function dragended(event, d) { if (!event.active) simulation.alphaTarget(0.025); d.fx = null; d.fy = null; }

            window.addEventListener('resize', () => {
                width = window.innerWidth;
                height = window.innerHeight;
                svg.attr("width", width).attr("height", height);
                applySizing(); updateDOMSizes();

                updateLegendBounds();

                let forceXStrength = isCentered ? (width < 600 ? 0.028 : 0.015) : (width < 600 ? 0.005 : 0.003);
                let forceYStrength = isCentered ? (width < 600 ? 0.010 : 0.008) : (width < 600 ? 0.001 : 0.003);
                simulation.force("x", d3.forceX(width * 0.5).strength(forceXStrength));
                simulation.force("y", d3.forceY(height * 0.5).strength(forceYStrength));
                simulation.alpha(0.1).restart();
            });
        </script>
    </body>
    </html>
